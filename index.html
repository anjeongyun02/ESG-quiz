<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESG 이슈 퀴즈</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Gowun+Batang:wght@700&display=swap">
<style>
[hidden]{{display:none!important}} img{{max-width:100%}} body{{margin:0}}
/* Layout: one narrow study column — header, tab switch, then either the quiz card or the topic reference */
:root{
  --bg:#f5f6f3; --surface:#ffffff; --fg:#1d2420; --muted:#5d6a63; --line:#dde2dc;
  --accent:#1f5f4a; --accent-soft:#e3efe9;
  --e:#2f7d5b; --s:#b26a1f; --g:#3c5a8a;
  --ok:#2f7d5b; --ok-soft:#e2f2e8; --bad:#b4423a; --bad-soft:#f8e6e3;
  --display:"Gowun Batang", "Noto Serif KR", serif;
  --body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141917; --surface:#1c2320; --fg:#e7ece8; --muted:#9aa8a0; --line:#2e3833;
  --accent:#7cc7a5; --accent-soft:#1f3229;
  --e:#6cc497; --s:#e0a35e; --g:#8fa9d8;
  --ok:#6cc497; --ok-soft:#1d3428; --bad:#ec8a80; --bad-soft:#3a2321; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141917; --surface:#1c2320; --fg:#e7ece8; --muted:#9aa8a0; --line:#2e3833;
  --accent:#7cc7a5; --accent-soft:#1f3229;
  --e:#6cc497; --s:#e0a35e; --g:#8fa9d8;
  --ok:#6cc497; --ok-soft:#1d3428; --bad:#ec8a80; --bad-soft:#3a2321; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.65;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:28px 56px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:13px;letter-spacing:.08em;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-size:clamp(28px,6vw,38px);line-height:1.25;margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:0}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;width:fit-content}
.tabs button{border:0;background:transparent;color:var(--muted);font:600 15px var(--body);padding:8px 16px;border-radius:7px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--bg)}
button:focus-visible,.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:18px}
.progress{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:2px 10px;border-radius:999px;border:1px solid currentColor}
.tag.E{color:var(--e)} .tag.S{color:var(--s)} .tag.G{color:var(--g)}
.q{font-size:19px;font-weight:600;line-height:1.5;margin:0;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;font:500 16px/1.5 var(--body);color:var(--fg);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.right .k{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.hintbtn{align-self:flex-start;background:none;border:0;color:var(--accent);font:600 14px var(--body);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
.hint{font-size:15px;color:var(--muted);margin:0;padding:10px 14px;border-left:3px solid var(--line)}
.fb{border-radius:10px;padding:14px 16px;font-size:15px}
.fb b{display:block;margin-bottom:4px;font-size:16px}
.fb.ok{background:var(--ok-soft)} .fb.ok b{color:var(--ok)}
.fb.no{background:var(--bad-soft)} .fb.no b{color:var(--bad)}
.actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.btn{border:0;background:var(--accent);color:var(--bg);font:600 15px var(--body);padding:11px 20px;border-radius:9px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.score{font-family:var(--display);font-size:56px;line-height:1;margin:0;font-variant-numeric:tabular-nums}
.score small{font-size:24px;color:var(--muted)}
.review{display:flex;flex-direction:column;gap:12px}
.review h3{font-size:16px;margin:0}
.ritem{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.ritem p{margin:0} .ritem .ans{color:var(--ok);font-weight:600} .ritem .mine{color:var(--bad)}
/* reference */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font:600 14px var(--body);padding:6px 14px;border-radius:999px;cursor:pointer}
.filters button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.topics{display:flex;flex-direction:column;gap:12px}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 18px}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 0;font-weight:600;font-size:17px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";margin-left:auto;color:var(--muted);font-weight:400;font-size:20px}
details[open] summary::after{content:"−"}
.def{margin:0 0 12px;color:var(--fg)}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0 0 16px;font-size:15px}
dt{color:var(--muted);font-weight:600;white-space:nowrap}
dd{margin:0;min-width:0}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:15px}
.field input{font:500 16px var(--body);color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:9px;padding:11px 14px;width:100%}
.field input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.err{color:var(--bad);font-size:14px;margin:0}
.who{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;font-size:15px;color:var(--muted)}
.who b{color:var(--fg);font-size:17px}
.receipt{background:var(--bg);border:1.5px dashed var(--line);border-radius:10px;padding:14px 16px;font-size:15px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.note{font-size:14px;color:var(--muted);margin:0}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)} .opt.sel .k{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.stage{font-weight:600;color:var(--accent)}
.actions.spread{justify-content:space-between}
.btn:disabled{opacity:.35;cursor:default}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dot{width:32px;height:32px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);font:600 13px var(--body);cursor:pointer;font-variant-numeric:tabular-nums}
.dot.done{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent)}
.dot.cur{border-color:var(--accent)}
.studybox{display:flex;flex-direction:column;gap:10px;background:var(--bg);border-radius:12px;padding:14px}
.studylabel{margin:0;font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--muted)}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.tcard-h{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:16px}
.tcard dl{margin:0}
footer{font-size:13px;color:var(--muted);text-align:center}
@media (max-width:480px){.card{padding:18px}.q{font-size:18px}dl{grid-template-columns:1fr;gap:0}dt{margin-top:8px}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="eyebrow">E 환경 8 · S 사회 9 · G 지배구조 9</span>
    <h1>ESG 주요 주제와 이슈 퀴즈</h1>
    <p class="lede">15문항을 모두 푼 뒤 채점하고, 틀린 문제는 관련 주제를 읽으며 다시 풀어 보세요.</p>
  </header>

  <div class="tabs" role="tablist">
    <button id="tab-quiz" role="tab" aria-selected="true">퀴즈</button>
    <button id="tab-ref" role="tab" aria-selected="false">주제 정리</button>
  </div>

  <section id="quiz" class="card" aria-live="polite"></section>

  <section id="ref" hidden>
    <div class="topics-head" style="display:flex;flex-direction:column;gap:12px">
      <div class="filters" id="filters">
        <button aria-pressed="true" data-f="all">전체</button>
        <button aria-pressed="false" data-f="E">E 환경</button>
        <button aria-pressed="false" data-f="S">S 사회</button>
        <button aria-pressed="false" data-f="G">G 지배구조</button>
      </div>
      <div class="topics" id="topics"></div>
    </div>
  </section>

  <footer>2026년 2학기 ESG부트캠프 · 안정윤 교수</footer>
</div>

<script>
const QS=[
{a:"E",p:"'자원을 적게 쓰고, 제품을 오래 사용하며, 사용 후 자원을 다시 활용하는 것'은 어떤 주제의 설명일까요?",o:["친환경 제품·원재료","자원순환·폐기물","에너지","온실가스·탄소중립"],c:1,h:"'덜 쓰고, 오래 쓰고, 다시 쓴다'는 흐름에 주목하세요.",x:"자원순환·폐기물의 정의입니다. 친환경 제품·원재료는 원료 조달부터 폐기까지 제품 전과정의 환경영향을 줄이도록 설계·구매하는 데 초점이 있습니다."},
{a:"E",p:"'재생전력 구매계약(PPA)'은 어떤 주제의 대표적인 기업 활동일까요?",o:["에너지","협력사 상생·공급망","재생에너지","용수"],c:2,h:"전력을 '얼마나 덜 쓰느냐'가 아니라 '어떤 전력을 쓰느냐'의 문제입니다.",x:"PPA는 재생에너지 발전사업자와 전력을 직접 계약해 조달하는 방식으로, 재생에너지 주제의 활동입니다. 에너지 주제는 사용량과 효율 관리(고효율 설비, 폐열 회수 등)에 초점이 있습니다."},
{a:"E",p:"'취수량·물 소비량 감소, 재이용률 증가'는 어떤 주제의 성과 지표일까요?",o:["오염물질·유해물질","용수","생물다양성","지역사회·사회공헌"],c:1,x:"용수 주제의 성과 지표입니다. 용수는 물 사용량뿐 아니라 물 부족과 지역 수자원에 미치는 영향까지 관리하는 주제입니다."},
{a:"E",p:"다음 중 '생물다양성' 주제의 이슈로 보기 어려운 것은?",o:["산림·서식지 훼손","해양생태계 영향","생물자원 고갈","유해화학물질 유출·노출"],c:3,h:"대기·물·토양 오염과 유해물질을 다루는 별도 주제가 있습니다.",x:"유해화학물질 유출·노출은 '오염물질·유해물질' 주제의 이슈입니다. 생물다양성은 생물종, 유전적 특성, 생태계의 다양성과 그 연결 관계를 보전하는 데 초점이 있습니다."},
{a:"E",p:"'전과정평가(LCA)'와 '저전력·저탄소 제품 개발'이 대표 활동인 주제는?",o:["친환경 제품·원재료","제품·서비스 안전과 품질","에너지","자원순환·폐기물"],c:0,x:"친환경 제품·원재료 주제입니다. 원료 조달부터 사용·폐기까지 제품 전과정의 환경영향을 평가하고 줄이는 것이 핵심이며, 성과는 동일 기능 기준 환경영향 감소와 제품 탄소발자국 감소로 봅니다."},
{a:"S",p:"다음 중 '산업안전보건' 주제의 이슈에 명시적으로 포함된 것은?",o:["협력사 근로자의 위험 노출","제품 결함과 리콜","고객 불만 처리 지연","인재 이탈"],c:0,h:"산업안전보건의 범위는 자사 임직원에만 머무르지 않습니다.",x:"산업안전보건의 이슈는 산업재해, 직업성 질병, 협력사 근로자의 위험 노출입니다. 제품 결함은 '제품·서비스 안전과 품질', 고객 불만은 '고객 권익·접근성', 인재 이탈은 '인재·조직문화'의 이슈입니다."},
{a:"S",p:"'인권 실사, 고충처리·피해 구제'를 실행한 기업의 성과 지표로 가장 적절한 것은?",o:["이직률 변화","확인된 인권 위험의 개선율, 재발 감소","협력사 판로·거래 안정성 개선","제보자 보호 수준"],c:1,x:"인권·노동권 주제의 성과는 확인된 인권 위험의 개선율, 피해 구제 이행, 재발 감소입니다. 제보자 보호 수준은 '윤리·반부패', 이직률은 '인재·조직문화'의 지표입니다."},
{a:"S",p:"'VOC 처리, 교환·환불, 정보 제공, 접근성 개선'이 대표 활동인 주제는?",o:["제품·서비스 안전과 품질","디지털·창작자 권익","고객 권익·접근성","개인정보보호·정보보안"],c:2,h:"제품이 '안전한가'보다 고객이 '공정하게 대우받고 구제받는가'의 문제입니다.",x:"고객 권익·접근성 주제입니다. 정확한 정보 제공, 공정한 대우, 누구나 이용·구제받을 수 있도록 하는 것이 핵심입니다. 제품·서비스 안전과 품질은 품질검사, 안전성 평가, 리콜, 부작용 모니터링이 대표 활동입니다."},
{a:"G",p:"'행동규범, 원료 추적, 실사·시정조치·보고체계 운영'은 어느 주제의 활동일까요?",o:["S – 협력사 상생·공급망","G – 공급망 감독체계","S – 인권·노동권","G – ESG 관리체계"],c:1,h:"'지원'인지, '기준·책임·감독 체계'인지 구분해 보세요.",x:"G의 공급망 감독체계입니다. 행동기준, 실사, 개선 조치와 보고·감독 책임을 운영하는 체계에 초점이 있습니다. S의 협력사 상생·공급망은 ESG 평가·개선 지원, 교육·기술·자금·판로 지원처럼 협력사를 함께 성장시키는 활동입니다."},
{a:"G",p:"'책임자·위원회 지정, AI 원칙, 심의·보고·감독 절차'가 대표 활동인 주제는?",o:["S – 개인정보보호·정보보안","S – 디지털·창작자 권익","G – 정보보호·AI 거버넌스","G – 리스크 관리·내부통제"],c:2,x:"G의 정보보호·AI 거버넌스입니다. 이슈는 정보보호·AI 의사결정과 감독 책임이 불명확한 것입니다. S의 개인정보보호·정보보안은 접근통제·암호화, 보안관제 같은 실제 보호 조치에 초점이 있습니다."},
{a:"S",p:"'저작권 침해, 유해 콘텐츠, AI 편향'은 어떤 주제의 이슈일까요?",o:["디지털·창작자 권익","고객 권익·접근성","정보공시·투명성","준법·공정거래"],c:0,x:"디지털·창작자 권익 주제입니다. 창작자와 디지털 이용자의 권리를 보호하고 콘텐츠·AI 활용의 피해를 예방하는 것이 핵심이며, 활동으로 공정한 계약, 권리침해 대응, 콘텐츠 관리, AI 영향 점검이 있습니다."},

["G","주주 권리","주주가 정보를 얻고, 의결권을 행사하며, 공정하게 대우받을 수 있도록 보장하는 것.","소수주주 권익 침해, 의결권·정보 접근의 제약","주주총회 참여 지원, 주주 소통, 배당·환원 정책 공개","의결권 행사 접근성 개선, 정책 이행, 주주 질의 대응 개선"],
["G","정보공시·투명성","이해관계자가 판단할 수 있도록 기업의 목표·실적·위험·관리체계를 정확하게 공개하는 것.","중요 정보 누락, 과장된 성과, 불명확한 산정범위","목표·실적·산정기준 공개, 데이터 검토, 오류 정정·검증","공시의 정확성·완전성·비교가능성 향상, 반복 오류 감소"],
["G","공급망 감독체계","공급망의 위험을 관리하기 위해 행동기준, 실사, 개선 조치와 보고·감독 책임을 운영하는 것.","관리 기준·책임 부족, 실사 후 개선 미이행","행동규범, 원료 추적, 실사·시정조치·보고체계 운영","추적 가능 범위 확대, 고위험 공급사 개선 조치 완료"],
["G","정보보호·AI 거버넌스","정보보호와 AI 활용에 관한 기준을 정하고, 의사결정·점검·보고 책임을 명확히 하는 것.","정보보호·AI 의사결정과 감독 책임 불명확","책임자·위원회 지정, AI 원칙, 심의·보고·감독 절차","위험 검토·개선 조치 이행, 책임 공백 해소"]
];

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MARK="①②③④";
/* 문제마다 복습할 주제(정답 주제, 그리고 헷갈리기 쉬운 비교 주제) */
const TOP=[["자원순환·폐기물","친환경 제품·원재료"],["재생에너지","에너지"],["용수"],["생물다양성","오염물질·유해물질"],["친환경 제품·원재료","자원순환·폐기물"],["산업안전보건"],["인권·노동권"],["고객 권익·접근성","제품·서비스 안전과 품질"],["공급망 감독체계","협력사 상생·공급망"],["정보보호·AI 거버넌스","개인정보보호·정보보안"],["디지털·창작자 권익"],["ESG 관리체계"],["준법·공정거래","윤리·반부패"],["리스크 관리·내부통제"],["정보공시·투명성"]];
const quiz=document.getElementById("quiz");
let i=0, picks=[];          // 1단계: 전체 풀기
let pool=[], ri=0, rpicks=[]; // 2단계: 틀린 문제 복습

function topicCard(name){
  const t=T.find(x=>x[1]===name); if(!t) return "";
  return `<div class="tcard"><div class="tcard-h"><span class="tag ${t[0]}">${t[0]}</span><b>${esc(t[1])}</b></div>
  <p class="def">${esc(t[2])}</p><dl><dt>이슈</dt><dd>${esc(t[3])}</dd><dt>활동</dt><dd>${esc(t[4])}</dd><dt>성과</dt><dd>${esc(t[5])}</dd></dl></div>`;
}
function head(label,cur,total,fill){
  return `<div class="progress"><span class="stage">${label}</span><span>${cur} / ${total}</span></div><div class="bar"><i style="width:${fill}%"></i></div>`;
}

let who={name:"",id:""};
function renderStart(){
  quiz.innerHTML=`<p class="q" style="margin:0">시작하기 전에 학번과 이름을 적어 주세요.</p>
  <form id="startForm" novalidate style="display:flex;flex-direction:column;gap:16px">
    <div class="field"><label for="sid">학번</label><input id="sid" inputmode="numeric" autocomplete="off" value="${esc(who.id)}"></div>
    <div class="field"><label for="sname">이름</label><input id="sname" autocomplete="name" value="${esc(who.name)}"></div>
    <p class="err" id="startErr" hidden></p>
    <div class="actions"><button class="btn" type="submit">퀴즈 시작</button></div>
  </form>
  <p class="note">15문항을 모두 풀면 채점 결과와 틀린 문제 해설이 나오고, 틀린 문제만 다시 공부할 수 있어요.</p>`;
  document.getElementById("startForm").addEventListener("submit",e=>{
    e.preventDefault();
    const s=document.getElementById("sid").value.trim(), n=document.getElementById("sname").value.trim();
    const err=document.getElementById("startErr");
    if(!s||!n){err.textContent=!s&&!n?"학번과 이름을 모두 입력해 주세요.":!s?"학번을 입력해 주세요.":"이름을 입력해 주세요.";err.hidden=false;return;}
    who={name:n,id:s}; i=0; picks=[]; renderQ();
  });
}
const whoLine=()=>`<div class="who"><span>${esc(who.id)}</span><b>${esc(who.name)}</b></div>`;
/* ── 1단계: 15문항 모두 풀기 (정답은 마지막에) ── */
function renderQ(){
  const q=QS[i], picked=picks[i];
  const answered=picks.filter(v=>v!==undefined).length;
  let h=head("1단계 · 전체 풀기",i+1,QS.length,answered/QS.length*100)+
  `<span class="tag ${q.a}" style="align-self:flex-start">${AREA[q.a]}</span>
  <p class="q">${i+1}. ${esc(q.p)}</p><div class="opts" role="radiogroup">`;
  q.o.forEach((t,k)=>{h+=`<button class="opt${picked===k?" sel":""}" role="radio" aria-checked="${picked===k}" data-k="${k}"><span class="k">${MARK[k]}</span><span>${esc(t)}</span></button>`;});
  h+=`</div>`;
  if(q.h) h+=`<button class="hintbtn" id="hb">힌트 보기</button><p class="hint" id="hint" hidden>${esc(q.h)}</p>`;
  h+=`<div class="dots" aria-label="문항 이동">${QS.map((_,k)=>`<button class="dot${picks[k]!==undefined?" done":""}${k===i?" cur":""}" data-go="${k}" aria-label="${k+1}번">${k+1}</button>`).join("")}</div>
  <p class="err" id="miss" hidden></p>
  <div class="actions spread"><button class="btn ghost" id="prev" ${i===0?"disabled":""}>이전</button>
  ${i<QS.length-1?`<button class="btn" id="next">다음</button>`:`<button class="btn" id="grade">채점하기</button>`}</div>`;
  quiz.innerHTML=h;
  quiz.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{picks[i]=+b.dataset.k;
    if(i<QS.length-1){i++;} renderQ();});
  quiz.querySelectorAll(".dot").forEach(b=>b.onclick=()=>{i=+b.dataset.go;renderQ();});
  const hb=document.getElementById("hb"); if(hb) hb.onclick=()=>{document.getElementById("hint").hidden=false;hb.remove();};
  document.getElementById("prev").onclick=()=>{if(i>0){i--;renderQ();}};
  const nx=document.getElementById("next"); if(nx) nx.onclick=()=>{i++;renderQ();};
  const gr=document.getElementById("grade"); if(gr) gr.onclick=()=>{
    const left=QS.map((_,k)=>k).filter(k=>picks[k]===undefined);
    if(left.length){const m=document.getElementById("miss");m.textContent=`아직 풀지 않은 문항이 있어요: ${left.map(k=>k+1).join(", ")}번`;m.hidden=false;return;}
    renderResult();
  };
}

/* ── 채점 결과: 점수 + 틀린 문제 해설 ── */
function renderResult(){
  const wrong=QS.map((q,k)=>k).filter(k=>picks[k]!==QS[k].c);
  const n=QS.length-wrong.length;
  const msg=n===QS.length?"모든 문제를 맞혔어요. 주제 구분이 확실합니다.":n>=12?"잘했어요. 틀린 문제만 다시 공부하면 완벽해요.":n>=8?"기본은 잡혔어요. 비슷한 주제끼리의 차이를 다시 살펴봐요.":"틀린 문제를 하나씩 다시 공부해 봐요.";
  let h=head("채점 결과",QS.length,QS.length,100)+whoLine()+
  `<p class="score">${n}<small> / ${QS.length}</small></p><p style="margin:0">${msg}</p>`;
  if(wrong.length){
    h+=`<div class="review"><h3>틀린 문제 해설 (${wrong.length}문항)</h3>`;
    wrong.forEach(k=>{const q=QS[k];h+=`<div class="ritem"><p><span class="tag ${q.a}">${q.a}</span> <b>${k+1}.</b> ${esc(q.p)}</p><p class="mine">내 답: ${MARK[picks[k]]} ${esc(q.o[picks[k]])}</p><p class="ans">정답: ${MARK[q.c]} ${esc(q.o[q.c])}</p><p>${esc(q.x)}</p></div>`;});
    h+=`</div><div class="actions spread"><button class="btn ghost" id="again">처음부터 다시</button><button class="btn" id="study">틀린 문제 다시 공부하기</button></div>`;
  } else {
    h+=`<div class="actions"><button class="btn" id="again">처음부터 다시</button></div>`;
  }
  quiz.innerHTML=h; quiz.scrollIntoView({block:"start"});
  document.getElementById("again").onclick=restart;
  const st=document.getElementById("study"); if(st) st.onclick=()=>{pool=wrong;ri=0;rpicks=[];renderStudy();};
}

/* ── 2단계: 틀린 문제만 주제 정리와 함께 다시 풀기 ── */
function renderStudy(){
  const k=pool[ri], q=QS[k], picked=rpicks[ri], done=picked!==undefined;
  let h=head("2단계 · 틀린 문제 다시 공부하기",ri+1,pool.length,(ri+(done?1:0))/pool.length*100)+
  `<span class="tag ${q.a}" style="align-self:flex-start">${AREA[q.a]} · 원래 ${k+1}번</span>`;
  if(!done){
    h+=`<div class="studybox"><p class="studylabel">먼저 관련 주제를 읽어 보세요</p>${TOP[k].map(topicCard).join("")}</div>`;
  }
  h+=`<p class="q">${esc(q.p)}</p><div class="opts">`;
  q.o.forEach((t,j)=>{let cls="";if(done){if(j===q.c)cls="right";else if(j===picked)cls="wrong";}
    h+=`<button class="opt ${cls}" data-k="${j}" ${done?"disabled":""}><span class="k">${MARK[j]}</span><span>${esc(t)}</span></button>`;});
  h+=`</div>`;
  if(done){
    const ok=picked===q.c;
    h+=`<div class="fb ${ok?"ok":"no"}"><b>${ok?"이번엔 맞혔어요":"다시 틀렸어요 · 정답은 "+MARK[q.c]}</b>${esc(q.x)}</div>
    <div class="actions"><button class="btn" id="rnext">${ri===pool.length-1?"복습 결과 보기":"다음 문제"}</button></div>`;
  }
  quiz.innerHTML=h;
  quiz.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{rpicks[ri]=+b.dataset.k;renderStudy();document.getElementById("rnext")?.focus();});
  const rn=document.getElementById("rnext"); if(rn) rn.onclick=()=>{if(ri<pool.length-1){ri++;renderStudy();quiz.scrollIntoView({block:"start"});}else renderStudyEnd();};
}
function renderStudyEnd(){
  const still=pool.filter((k,j)=>rpicks[j]!==QS[k].c);
  const got=pool.length-still.length;
  let h=head("복습 결과",pool.length,pool.length,100)+whoLine()+
  `<p class="score">${got}<small> / ${pool.length}</small></p>
  <p style="margin:0">${still.length?`아직 헷갈리는 문제가 ${still.length}개 있어요. 한 번 더 공부해 봐요.`:"틀렸던 문제를 모두 맞혔어요. 수고했어요!"}</p>`;
  if(still.length){
    h+=`<div class="review"><h3>아직 헷갈리는 문제</h3>${still.map(k=>`<div class="ritem"><p><span class="tag ${QS[k].a}">${QS[k].a}</span> <b>${k+1}.</b> ${esc(QS[k].p)}</p></div>`).join("")}</div>
    <div class="actions spread"><button class="btn ghost" id="again">처음부터 다시</button><button class="btn" id="more">남은 문제 다시 공부하기</button></div>`;
  } else h+=`<div class="actions"><button class="btn" id="again">처음부터 다시</button></div>`;
  quiz.innerHTML=h;
  document.getElementById("again").onclick=restart;
  const mo=document.getElementById("more"); if(mo) mo.onclick=()=>{pool=still;ri=0;rpicks=[];renderStudy();};
}
function restart(){i=0;picks=[];pool=[];rpicks=[];renderStart();quiz.scrollIntoView({block:"start"});}

const topics=document.getElementById("topics");
function renderTopics(f){
  topics.innerHTML=T.filter(t=>f==="all"||t[0]===f).map(t=>`<details><summary><span class="tag ${t[0]}">${t[0]}</span>${esc(t[1])}</summary>
  <p class="def">${esc(t[2])}</p><dl><dt>이슈</dt><dd>${esc(t[3])}</dd><dt>활동</dt><dd>${esc(t[4])}</dd><dt>성과</dt><dd>${esc(t[5])}</dd></dl></details>`).join("");
}
document.querySelectorAll("#filters button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("#filters button").forEach(x=>x.setAttribute("aria-pressed",x===b));
  renderTopics(b.dataset.f);
});
function showTab(t){
  document.getElementById("quiz").hidden=t!=="quiz";
  document.getElementById("ref").hidden=t!=="ref";
  document.getElementById("tab-quiz").setAttribute("aria-selected",t==="quiz");
  document.getElementById("tab-ref").setAttribute("aria-selected",t==="ref");
}
document.getElementById("tab-quiz").onclick=()=>showTab("quiz");
document.getElementById("tab-ref").onclick=()=>showTab("ref");

renderStart(); renderTopics("all");
</script>
</body>
</html>
